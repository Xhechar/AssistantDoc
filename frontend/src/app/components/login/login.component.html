<div class="login-container">
    <div class="login-content">
        <div class="login-info">
            <div class="logo">
                <i class="bx bx-plus-medical"></i>
                <h2>Assistant<span>Doc</span></h2>
            </div>
            <h1>Welcome Back</h1>
            <p>Access your dashboard to manage patients, appointments, and health programs with ease.</p>
            <div class="login-image">
                <img src="/api/placeholder/400/320" alt="Doctor with tablet">
            </div>
        </div>

        <div class="login-form">
            <div class="form-header">
                <a href="/" class="home-link">
                    <i class="bx bx-home"></i>
                </a>
                <h3>Log In</h3>
            </div>

            <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm.value)" novalidate>
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-container">
                        <i class="bx bx-envelope"></i>
                        <input type="email" id="email" name="Email" [(ngModel)]="loginModel.Email" #email="ngModel"
                            required email placeholder="Enter your email address">
                    </div>
                    <div class="error-message" *ngIf="email.invalid && (email.dirty || email.touched)">
                        <small *ngIf="email.errors?.['required']">Email is required</small>
                        <small *ngIf="email.errors?.['email']">Please enter a valid email address</small>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <i class="bx bx-lock"></i>
                        <input [type]="showPassword ? 'text' : 'password'" id="password" name="Password"
                            [(ngModel)]="loginModel.Password" #password="ngModel" required
                            placeholder="Enter your password">
                        <i class="toggle-password" [class.bx-show]="!showPassword" [class.bx-hide]="showPassword"
                            (click)="togglePasswordVisibility()"></i>
                    </div>
                    <div class="error-message" *ngIf="password.invalid && (password.dirty || password.touched)">
                        <small *ngIf="password.errors?.['required']">Password is required</small>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <div class="form-check">
                        <input type="checkbox" id="remember" name="remember" [(ngModel)]="rememberMe">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" [disabled]="loginForm.invalid" [class.disabled]="loginForm.invalid"
                    class="login-btn">
                    <i class="bx bx-log-in"></i>
                    Log In
                </button>

                <!-- Social Login -->
                <div class="social-login">
                    <p>Or sign in with</p>
                    <div class="social-buttons">
                        <button type="button" class="social-btn google">
                            <i class="fab fa-google"></i>
                        </button>
                        <button type="button" class="social-btn facebook">
                            <i class="fab fa-facebook-f"></i>
                        </button>
                        <button type="button" class="social-btn apple">
                            <i class="fab fa-apple"></i>
                        </button>
                    </div>
                </div>

                <p class="signup-link">Don't have an account? <a routerLink="/register">Sign up</a></p>
            </form>
        </div>
    </div>
</div>
